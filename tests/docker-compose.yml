# Throwaway database servers for the integration tests (`npm run test:integration:required`).
#
#   docker compose -f tests/docker-compose.yml up -d --wait
#   docker compose -f tests/docker-compose.yml down -v      # removes containers and data
#
# Every port is bound to 127.0.0.1 only, and never to 3306/3307 (real servers live there).
# The credentials are throwaway test values (root / navidog, database navidog_test) that
# match the URLs documented in the README; they have nothing to do with real data.
#
# If the older stand-alone 8.4 container (navidog-test-mysql or electrondb-test-mysql) already
# owns 33306, start only the 5.7 service:
#   docker compose -f tests/docker-compose.yml up -d --wait mysql57
#
# MariaDB (33311) and PostgreSQL (55432, plus a throwaway SSH server on 52222 for the tunnel
# test) are here since 2.0.0, and MongoDB 8.2 (57017 standalone with authentication, 57018 a
# single-node replica set for transactions). Start only some services by naming them:
#   docker compose -f tests/docker-compose.yml up -d --wait mariadb11 postgres17 sshd
#   docker compose -f tests/docker-compose.yml up -d --wait mongo82 mongo82rs
# The replica set needs one `rs.initiate` after its first start (idempotent):
#   docker compose -f tests/docker-compose.yml exec mongo82rs mongosh --port 57018 --quiet \
#     --eval 'try { rs.status() } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:57018" }] }) }'
# SQL Server 2022 (51433, amd64 only: emulated on Apple Silicon) since 2.6.0:
#   docker compose -f tests/docker-compose.yml up -d --wait mssql22
# (The stand-alone containers vortaq-test-mongo / vortaq-test-mongo-rs started with `docker run`
# use the same ports; run either those or these services.)
name: electrondb-test

services:
  # VORTAQ_TEST_MYSQL_URL=mysql://root:navidog@127.0.0.1:33306/navidog_test
  mysql84:
    image: mysql:8.4.7
    environment:
      MYSQL_ROOT_PASSWORD: navidog
      MYSQL_DATABASE: navidog_test
    ports:
      - '127.0.0.1:33306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h127.0.0.1', '-uroot', '-pnavidog', '--silent']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # VORTAQ_TEST_MYSQL57_URL=mysql://root:navidog@127.0.0.1:33357/navidog_test
  # mysql:5.7 is amd64-only: on Apple Silicon it runs emulated (slower first start).
  # Stock server settings on purpose (latin1 server charset, 5.7 default sql_mode), so the
  # tests see what a default 5.7 production server does.
  mysql57:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: navidog
      MYSQL_DATABASE: navidog_test
    ports:
      - '127.0.0.1:33357:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h127.0.0.1', '-uroot', '-pnavidog', '--silent']
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 20s

  # VORTAQ_TEST_MARIADB_URL=mysql://root:navidog@127.0.0.1:33311/navidog_test
  # Native arm64/amd64 image. A `mysql` connection pointed at it exercises the MariaDB fixes.
  mariadb11:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: navidog
      MARIADB_DATABASE: navidog_test
    ports:
      - '127.0.0.1:33311:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  # VORTAQ_TEST_PG_URL=postgres://postgres:navidog@127.0.0.1:55432/navidog_test
  # uuid-ossp and pgcrypto are created in `public` by the tests themselves (idempotent).
  postgres17:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: navidog
      POSTGRES_DB: navidog_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'navidog_test']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # VORTAQ_TEST_SSH_URL=ssh://vortaq:navidog@127.0.0.1:52222  (optional)
  # Throwaway SSH server on the compose network: the PostgreSQL tunnel test connects to it and
  # forwards to `postgres17:5432`. Password login for a test-only user; never reuse elsewhere.
  sshd:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      USER_NAME: vortaq
      USER_PASSWORD: navidog
      PASSWORD_ACCESS: 'true'
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - '127.0.0.1:52222:2222'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 2222 || exit 1']
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  # VORTAQ_TEST_MONGO_URL=mongodb://root:navidog@127.0.0.1:57017/?authSource=admin
  # Pinned to 8.2: mongo:8 (8.3.x) refuses to start on Docker Desktop kernels >= 6.19.
  mongo82:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: navidog
    ports:
      - '127.0.0.1:57017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # VORTAQ_TEST_MONGO_RS_URL=mongodb://127.0.0.1:57018/?replicaSet=rs0
  # Single-node replica set without authentication (a keyFile would be needed with it). mongod
  # listens on 57018 inside the container too, so the member address 127.0.0.1:57018 that
  # rs.initiate stores is reachable from the host and from inside.
  mongo82rs:
    image: mongo:8.2
    command: ['mongod', '--replSet', 'rs0', '--port', '57018', '--bind_ip_all']
    ports:
      - '127.0.0.1:57018:57018'
    healthcheck:
      test: ['CMD', 'mongosh', '--port', '57018', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  # VORTAQ_TEST_MSSQL_URL=mssql://sa:Navidog_2026@127.0.0.1:51433/navidog_test
  # SQL Server 2022 (16.0.4305.5, pinned by digest) is amd64-only: on Apple Silicon it runs
  # emulated. The sa password must meet SQL Server's complexity rules, hence Navidog_2026; the
  # tests create navidog_test themselves. Its TLS certificate is self-signed (trust it in tests).
  mssql22:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: Navidog_2026
      MSSQL_PID: Developer
    ports:
      - '127.0.0.1:51433:1433'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P Navidog_2026 -Q "SELECT 1" -b -o /dev/null'
        ]
      interval: 3s
      timeout: 10s
      retries: 100
      start_period: 20s
