# Publishes each editor extension release (tags vscode-v*) to the Visual Studio
# Marketplace with Trusted Publishing: GitHub's OIDC token is exchanged for a
# short Marketplace session, so no token is stored anywhere. It uploads the very
# .vsix of the GitHub release, after checking it against the release's
# SHA256SUMS.txt (integrity of the download, not authenticity: both come from
# the same release) and its manifest against the tag.
#
# Guards around the job that can publish:
# - the publisher's policy (y0rshb3 › Trusted Publishing) accepts only this
#   repository, this file and the `marketplace` environment;
# - `marketplace` may only run for `vscode-v*` tags and waits for the owner's
#   approval (required reviewer);
# - vsce and its whole dependency tree come from tools/vsce/package-lock.json
#   (exact versions and hashes, changed only by PR), installed without install
#   scripts; actions are pinned by commit.
# Re-run by hand: `gh workflow run publish-extension.yml --ref vscode-v<x.y.z>`.
name: Publicar la extensión en el Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-extension-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # Desktop releases (v*) and runs from a branch are skipped.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'vscode-v')
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: tools/vsce
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Instalar vsce (árbol fijado, sin scripts de instalación)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/vsce
      - name: Descargar el .vsix de la versión y comprobarlo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#vscode-v}"
          dir="$RUNNER_TEMP/vsix"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
            --pattern "vortaq-$version.vsix" --pattern SHA256SUMS.txt
          cd "$dir"
          sha256sum --check --strict SHA256SUMS.txt
          manifest="$(unzip -p "vortaq-$version.vsix" extension/package.json)"
          test "$(jq -r .publisher <<<"$manifest")" = y0rshb3
          test "$(jq -r .name <<<"$manifest")" = vortaq
          test "$(jq -r .version <<<"$manifest")" = "$version"
          echo "VSIX=$dir/vortaq-$version.vsix" >> "$GITHUB_ENV"
      - name: Publicar (Trusted Publishing)
        run: tools/vsce/node_modules/.bin/vsce publish --oidc --packagePath "$VSIX" --skip-duplicate
